<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedUp - Acesso</title>

    <link rel="stylesheet" href="style.css">
</head>

<header>
    <nav class="navbar">
        <div class="logo">Med<span>Up</span></div>

        <div class="nav-links">
            <a href="index.html">Início</a>
            <a href="nossotema.html">Nosso Tema</a>
            <a href="mconsulta.html">Marcar Consulta</a>
        </div>
    </nav>
</header>

<body class="pagina-login">

    <div class="login-container">

        <!-- LOGO -->
        <div class="login-logo">
            Med<span>Up</span>
        </div>

        <!-- TÍTULO -->
        <p class="subtitle" id="tituloForm">
            Entre na sua conta
        </p>

        <!-- MENSAGEM -->
        <p id="mensagem"></p>


        <!-- =========================
             LOGIN
        ========================= -->

        <form id="loginForm">

            <label for="loginEmail">E-mail</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="loginSenha">Senha</label>

            <input
                type="password"
                id="loginSenha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>


        <!-- =========================
             CADASTRO
        ========================= -->

        <form id="cadastroForm" class="formulario-cadastro">

            <label for="nome">Nome completo</label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome completo"
                required
            >


            <label for="cadastroEmail">E-mail</label>

            <input
                type="email"
                id="cadastroEmail"
                placeholder="Digite seu e-mail"
                required
            >


            <label for="telefone">Telefone</label>

            <input
                type="tel"
                id="telefone"
                placeholder="(00) 00000-0000"
                required
            >


            <label for="dataNascimento">
                Data de nascimento
            </label>

            <input
                type="date"
                id="dataNascimento"
                required
            >


            <label for="cadastroSenha">Senha</label>

            <input
                type="password"
                id="cadastroSenha"
                placeholder="Crie uma senha"
                required
            >


            <label for="confirmarSenha">
                Confirmar senha
            </label>

            <input
                type="password"
                id="confirmarSenha"
                placeholder="Digite a senha novamente"
                required
            >


            <button type="submit">
                Criar minha conta
            </button>

        </form>


        <!-- =========================
             ALTERNAR LOGIN / CADASTRO
        ========================= -->

        <div class="troca-form">

            <span id="textoTroca">
                Ainda não tem uma conta?
            </span>

            <button
                type="button"
                id="botaoTroca"
            >
                Cadastre-se
            </button>

        </div>

    </div>


    <script>

        // Elementos

        const loginForm =
            document.getElementById("loginForm");

        const cadastroForm =
            document.getElementById("cadastroForm");

        const botaoTroca =
            document.getElementById("botaoTroca");

        const textoTroca =
            document.getElementById("textoTroca");

        const tituloForm =
            document.getElementById("tituloForm");

        const mensagem =
            document.getElementById("mensagem");


        // Começa mostrando LOGIN

        cadastroForm.style.display = "none";


        // =========================
        // TROCAR LOGIN / CADASTRO
        // =========================

        botaoTroca.addEventListener("click", function() {

            mensagem.textContent = "";

            if (loginForm.style.display !== "none") {

                // Mostra cadastro

                loginForm.style.display = "none";
                cadastroForm.style.display = "flex";

                tituloForm.textContent =
                    "Crie sua conta";

                textoTroca.textContent =
                    "Já possui uma conta?";

                botaoTroca.textContent =
                    "Entrar";

            } else {

                // Mostra login

                loginForm.style.display = "flex";
                cadastroForm.style.display = "none";

                tituloForm.textContent =
                    "Entre na sua conta";

                textoTroca.textContent =
                    "Ainda não tem uma conta?";

                botaoTroca.textContent =
                    "Cadastre-se";
            }

        });


        // =========================
        // LOGIN
        // =========================

        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const email =
                document.getElementById("loginEmail").value;

            const senha =
                document.getElementById("loginSenha").value;


            // Procura usuário cadastrado

            const usuarioSalvo =
                localStorage.getItem("usuarioMedUp");


            if (usuarioSalvo) {

                const usuario =
                    JSON.parse(usuarioSalvo);


                if (
                    email === usuario.email &&
                    senha === usuario.senha
                ) {

                    localStorage.setItem(
                        "usuarioLogado",
                        "true"
                    );

                    localStorage.setItem(
                        "nomeUsuario",
                        usuario.nome
                    );

                    mensagem.style.color = "#159a9c";

                    mensagem.textContent =
                        "Login realizado com sucesso!";


                    setTimeout(function() {

                        window.location.href =
                            "index.html";

                    }, 1000);

                } else {

                    mensagem.style.color = "#d32f2f";

                    mensagem.textContent =
                        "E-mail ou senha incorretos.";
                }

            } else {

                mensagem.style.color = "#d32f2f";

                mensagem.textContent =
                    "Nenhuma conta cadastrada. Crie uma conta primeiro.";
            }

        });


        // =========================
        // CADASTRO
        // =========================

        cadastroForm.addEventListener("submit", function(event) {

            event.preventDefault();


            const nome =
                document.getElementById("nome").value;

            const email =
                document.getElementById("cadastroEmail").value;

            const telefone =
                document.getElementById("telefone").value;

            const dataNascimento =
                document.getElementById("dataNascimento").value;

            const senha =
                document.getElementById("cadastroSenha").value;

            const confirmarSenha =
                document.getElementById("confirmarSenha").value;


            // Verifica senha

            if (senha !== confirmarSenha) {

                mensagem.style.color = "#d32f2f";

                mensagem.textContent =
                    "As senhas não são iguais.";

                return;
            }


            // Verifica tamanho da senha

            if (senha.length < 6) {

                mensagem.style.color = "#d32f2f";

                mensagem.textContent =
                    "A senha precisa ter pelo menos 6 caracteres.";

                return;
            }


            // Verifica se já existe cadastro

            const usuarioExistente =
                localStorage.getItem("usuarioMedUp");


            if (usuarioExistente) {

                const usuario =
                    JSON.parse(usuarioExistente);


                if (usuario.email === email) {

                    mensagem.style.color = "#d32f2f";

                    mensagem.textContent =
                        "Esse e-mail já está cadastrado.";

                    return;
                }
            }


            // Cria usuário

            const usuario = {

                nome: nome,

                email: email,

                telefone: telefone,

                dataNascimento: dataNascimento,

                senha: senha

            };


            // Salva usuário

            localStorage.setItem(
                "usuarioMedUp",
                JSON.stringify(usuario)
            );


            mensagem.style.color = "#159a9c";

            mensagem.textContent =
                "Cadastro realizado com sucesso!";


            // Limpa formulário

            cadastroForm.reset();


            // Depois volta para login

            setTimeout(function() {

                loginForm.style.display = "flex";
                cadastroForm.style.display = "none";

                tituloForm.textContent =
                    "Entre na sua conta";

                textoTroca.textContent =
                    "Ainda não tem uma conta?";

                botaoTroca.textContent =
                    "Cadastre-se";

                mensagem.textContent = "";

            }, 1500);

        });

    </script>

</body>

</html>
